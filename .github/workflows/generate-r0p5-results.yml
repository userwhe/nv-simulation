name: Generate excited-state hyperfine r=0.5 results

on:
  push:
    branches:
      - agent/fix-process-frame-pulsed-pairs
    paths:
      - .github/workflows/generate-r0p5-results.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-results:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the result branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-process-frame-pulsed-pairs
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Generate all 21 pair results at r=0.5
        run: |
          python simulate_all_pairs.py \
            --force \
            --excited-hyperfine-scale 0.5 \
            --output-dir outputs/all_pairs_r0p5

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/all_pairs_r0p5
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Add all-pair results for excited-state hyperfine r=0.5"
            git push origin HEAD:agent/fix-process-frame-pulsed-pairs
          fi
